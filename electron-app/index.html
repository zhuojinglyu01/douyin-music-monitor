<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>抖音音乐飙升监控</title>
<style>
  :root {
    --bg: #0e1014; --panel: #171a21; --panel2: #1f232d; --line: #2b303b;
    --txt: #e7e9ee; --dim: #949aa6; --faint: #6b7280;
    --accent: #46d98a; --accent-deep: #2fb673; --warn: #eab463;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { font: 14px/1.6 -apple-system, "PingFang SC", sans-serif; color: var(--txt); padding: 40px 24px 60px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 26px; }
  .title { font-size: 20px; font-weight: 650; display: flex; align-items: center; gap: 9px; }
  .meta { color: var(--dim); font-size: 13px; font-weight: 400; }
  .pill { font-size: 12px; padding: 5px 13px; border-radius: 30px; background: var(--panel2); color: var(--dim); font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .pill.on { background: rgba(70,217,138,.14); color: var(--accent); }
  .pill.on::before { background: var(--accent); }
  .pill.off { background: rgba(234,180,99,.14); color: var(--warn); }
  .pill.off::before { background: var(--warn); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.10); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.20); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-resizer { display: none; background: transparent; }
  textarea { resize: none; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }

  .toolbar { margin-top: 20px; gap: 12px; }
  button { font: inherit; border: none; border-radius: 11px; padding: 11px 18px; cursor: pointer; color: var(--txt); background: var(--panel2); transition: .15s; font-weight: 500; }
  button:hover { background: #262b36; }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #06231a; font-weight: 650; }
  button.primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, var(--accent), var(--accent-deep)); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; margin-top: 20px; }
  .card h2 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .card-head { margin-bottom: 18px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  th { color: var(--faint); font-weight: 500; font-size: 11px; letter-spacing: .3px; }
  tr:last-child td { border-bottom: none; }
  .tier { font-weight: 600; white-space: nowrap; }
  .gain { color: var(--warn); font-weight: 700; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { color: var(--dim); text-align: center; padding: 34px; font-size: 13px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .field { margin-top: 18px; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 8px; }
  input, textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; color: var(--txt); padding: 11px 13px; font: inherit; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(70,217,138,.12); }
  textarea { resize: vertical; min-height: 88px; line-height: 1.7; }
  .save-row { margin-top: 20px; display: flex; align-items: center; gap: 14px; }
  .saved { color: var(--accent); font-size: 12px; opacity: 0; transition: .3s; }
  .saved.show { opacity: 1; }
  .log { margin-top: 4px; background: #0a0c10; color: #b7c2b0; border: 1px solid var(--line); border-radius: 12px; padding: 16px; font: 12px/1.7 ui-monospace, Menlo, monospace; max-height: 240px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row between">
      <div class="title">抖音音乐飙升监控 <span class="meta" id="meta"></span></div>
      <span class="pill" id="statusPill">…</span>
    </div>
    <div class="row toolbar">
      <button class="ghost" id="loginBtn">登录小号（扫码）</button>
      <button class="primary" id="startBtn">开始监控</button>
      <button id="stopBtn">暂停</button>
    </div>
  </header>

  <div class="card">
    <div class="row between card-head"><h2 style="margin:0">Rising List · 正在冲量</h2><span class="meta" id="risingTime"></span></div>
    <table>
      <thead><tr><th>档位</th><th>24h涨赞</th><th>增速</th><th>当前赞</th><th>作者 / 标题</th></tr></thead>
      <tbody id="risingBody"></tbody>
    </table>
    <div class="empty" id="risingEmpty">名单还没冒出在冲的视频——攒够几轮就会有。</div>
  </div>

  <div class="card">
    <h2 class="card-head">监控条件</h2>
    <div class="field">
      <label>话题词（每行一个）</label>
      <textarea id="hashtags"></textarea>
    </div>
    <div class="grid" style="margin-top:18px">
      <div><label>预警门槛（24h涨赞）</label><input id="alertGain24h" type="number" /></div>
      <div><label>Breaking 门槛（24h涨赞）</label><input id="breakingGain24h" type="number" /></div>
      <div><label>只看近几天发布</label><input id="recentDays" type="number" /></div>
      <div><label>每轮间隔（分钟）</label><input id="pollIntervalMinutes" type="number" /></div>
    </div>
    <div class="field"><label>Server酱 SendKey（推送到你微信）</label><input id="sendkey" type="text" placeholder="SCT..." /></div>
    <div class="save-row">
      <button class="primary" id="saveBtn">保存</button>
      <span class="saved" id="savedMsg">✓ 已保存，重启监控后生效</span>
    </div>
  </div>

  <div class="card">
    <div class="row between card-head"><h2 style="margin:0">运行日志</h2><span class="meta" id="logHint">每 3 秒刷新</span></div>
    <pre id="logBox" class="log"></pre>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
